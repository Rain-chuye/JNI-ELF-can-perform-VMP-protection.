<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Protection Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [file, setFile] = useState(null);
            const [taskId, setTaskId] = useState(null);
            const [status, setStatus] = useState(null);
            const [downloadUrl, setDownloadUrl] = useState(null);

            const handleUpload = async () => {
                if (!file) return alert("Please select a file first.");

                setStatus('uploading');
                const formData = new FormData();
                formData.append('file', file);
                formData.append('options', JSON.stringify({ vmp: true, strings: true }));

                try {
                    const res = await fetch('http://localhost:8000/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    setTaskId(data.task_id);
                    setStatus('processing');
                } catch (e) {
                    alert("Upload failed. Make sure the backend is running.");
                    setStatus(null);
                }
            };

            useEffect(() => {
                if (taskId) {
                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(`http://localhost:8000/status/${taskId}`);
                            const data = await res.json();
                            if (data.status === 'completed') {
                                setStatus('completed');
                                setDownloadUrl(`http://localhost:8000${data.download_url}`);
                                clearInterval(interval);
                            }
                        } catch (e) {
                            console.error("Status check failed", e);
                        }
                    }, 2000);
                    return () => clearInterval(interval);
                }
            }, [taskId]);

            return (
                <div class="min-h-screen flex flex-col">
                    <header class="gradient-bg text-white p-6 shadow-lg">
                        <div class="container mx-auto">
                            <h1 class="text-3xl font-extrabold tracking-tight">VMP Shield Pro</h1>
                            <p class="text-blue-100 mt-1">Enterprise Binary & JNI Protection System</p>
                        </div>
                    </header>

                    <main class="flex-grow container mx-auto p-8">
                        <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
                            <h2 class="text-xl font-semibold mb-6 text-gray-800">Protect Your Application</h2>

                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Source Code (C/C++)</label>
                                <div class="flex items-center justify-center w-full">
                                    <label class="flex flex-col w-full h-32 border-4 border-dashed border-gray-200 hover:bg-gray-50 hover:border-blue-300 transition-colors cursor-pointer rounded-lg">
                                        <div class="flex flex-col items-center justify-center pt-7">
                                            <p class="text-sm text-gray-400">Select file to protect</p>
                                            {file && <p class="text-blue-600 font-medium mt-2">{file.name}</p>}
                                        </div>
                                        <input type="file" class="hidden" onChange={(e) => setFile(e.target.files[0])} />
                                    </label>
                                </div>
                            </div>

                            <div class="space-y-4 mb-8">
                                <div class="flex items-center">
                                    <input type="checkbox" checked readOnly class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
                                    <label class="ml-2 text-gray-700">String Encryption (Hide sensitive constants)</label>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" checked readOnly class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
                                    <label class="ml-2 text-gray-700">Function Virtualization (VMP)</label>
                                </div>
                            </div>

                            <button
                                onClick={handleUpload}
                                disabled={status === 'processing' || status === 'uploading'}
                                class={`w-full py-3 rounded-lg font-bold text-white transition-all ${status === 'processing' ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700 shadow-lg hover:shadow-xl active:scale-95'}`}
                            >
                                {status === 'processing' ? 'Processing...' : 'Upload & Protect'}
                            </button>

                            {taskId && (
                                <div class="mt-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-gray-500">Task ID: {taskId.substring(0,8)}...</span>
                                        <span class={`px-3 py-1 rounded-full text-xs font-bold uppercase ${status === 'completed' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>
                                            {status}
                                        </span>
                                    </div>

                                    {status === 'completed' && (
                                        <div class="mt-4">
                                            <a
                                                href={downloadUrl}
                                                class="block w-full text-center py-2 bg-green-600 text-white rounded-md font-semibold hover:bg-green-700 transition-colors"
                                            >
                                                Download Protected Binary
                                            </a>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-100">
                                <h3 class="font-bold text-gray-800 mb-2">Anti-Static Analysis</h3>
                                <p class="text-sm text-gray-600">Encrypts all constant strings to prevent leakage of API keys, URLs, and sensitive metadata.</p>
                            </div>
                            <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-100">
                                <h3 class="font-bold text-gray-800 mb-2">Instruction VMP</h3>
                                <p class="text-sm text-gray-600">Translates native code to custom bytecode. Irreversible for standard decompilers like IDA or Ghidra.</p>
                            </div>
                            <div class="p-6 bg-white rounded-lg shadow-sm border border-gray-100">
                                <h3 class="font-bold text-gray-800 mb-2">JNI Security</h3>
                                <p class="text-sm text-gray-600">Specifically designed for Android NDK projects. Protects your .so files from tampering.</p>
                            </div>
                        </div>
                    </main>

                    <footer class="p-6 text-center text-gray-400 text-sm">
                        &copy; 2025 VMP Shield Pro. All rights reserved.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
