<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMP Shield Pro | Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .secure-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [file, setFile] = useState(null);
            const [arch, setArch] = useState('x86_64');
            const [taskId, setTaskId] = useState(null);
            const [status, setStatus] = useState(null);
            const [metadata, setMetadata] = useState(null);
            const [downloadUrl, setDownloadUrl] = useState(null);

            const handleUpload = async () => {
                if (!file) return alert("Please select a file.");

                setStatus('uploading');
                const formData = new FormData();
                formData.append('file', file);
                formData.append('options', JSON.stringify({ vmp: true, strings: true, arch: arch }));

                try {
                    const res = await fetch('http://localhost:8000/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    setTaskId(data.task_id);
                    setStatus('processing');
                } catch (e) {
                    alert("Connection error. Is the backend running?");
                    setStatus(null);
                }
            };

            useEffect(() => {
                if (taskId && status === 'processing') {
                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(`http://localhost:8000/status/${taskId}`);
                            const data = await res.json();
                            if (data.status === 'completed') {
                                setStatus('completed');
                                setDownloadUrl(`http://localhost:8000${data.download_url}`);
                                setMetadata(data.metadata);
                                clearInterval(interval);
                            }
                        } catch (e) { console.error(e); }
                    }, 2000);
                    return () => clearInterval(interval);
                }
            }, [taskId, status]);

            return (
                <div class="min-h-screen flex flex-col">
                    <header class="gradient-bg text-white p-6 shadow-xl border-b border-slate-700">
                        <div class="container mx-auto flex justify-between items-center">
                            <div>
                                <h1 class="text-3xl font-black tracking-tighter flex items-center">
                                    <i class="fas fa-shield-halved mr-3 text-blue-400"></i>
                                    VMP SHIELD PRO
                                </h1>
                                <p class="text-slate-400 text-sm font-medium mt-1 uppercase tracking-widest">Advanced Binary Hardening System</p>
                            </div>
                            <div class="hidden md:flex space-x-6 text-sm font-semibold text-slate-300">
                                <span class="hover:text-white cursor-pointer transition-colors">Documentation</span>
                                <span class="hover:text-white cursor-pointer transition-colors">Security Report</span>
                                <span class="bg-blue-600 px-4 py-2 rounded-full text-white">Enterprise v2.0</span>
                            </div>
                        </div>
                    </header>

                    <main class="flex-grow container mx-auto p-8 max-w-6xl">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Left Panel: Upload */}
                            <div class="lg:col-span-1 space-y-6">
                                <div class="glass-card p-8 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 class="text-xl font-bold mb-6 text-slate-800">1. Select Target</h2>

                                    <div class="mb-6">
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Target Architecture</label>
                                        <select
                                            value={arch}
                                            onChange={(e) => setArch(e.target.value)}
                                            class="w-full p-3 bg-slate-100 border-none rounded-xl text-slate-700 font-semibold focus:ring-2 focus:ring-blue-500 transition-all"
                                        >
                                            <option value="x86_64">Linux x64 (Standard)</option>
                                            <option value="aarch64">Android ARM64 (aarch64)</option>
                                            <option value="arm">Android ARM (32-bit)</option>
                                        </select>
                                    </div>

                                    <div class="mb-8">
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Upload Binary/Source</label>
                                        <div class="relative">
                                            <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition-all group">
                                                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                                    <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 group-hover:text-blue-500 mb-3"></i>
                                                    <p class="text-sm text-slate-500 font-medium">Click to upload .so, .c, or .cpp</p>
                                                    {file && <p class="mt-2 text-blue-600 font-bold bg-blue-100 px-3 py-1 rounded-full text-xs">{file.name}</p>}
                                                </div>
                                                <input type="file" class="hidden" onChange={(e) => setFile(e.target.files[0])} />
                                            </label>
                                        </div>
                                    </div>

                                    <button
                                        onClick={handleUpload}
                                        disabled={status === 'processing' || status === 'uploading'}
                                        class={`w-full py-4 rounded-2xl font-black text-white transition-all transform ${status === 'processing' ? 'bg-slate-300' : 'bg-blue-600 hover:bg-blue-700 shadow-lg hover:-translate-y-1 active:scale-95'}`}
                                    >
                                        {status === 'processing' ? (
                                            <span class="flex items-center justify-center">
                                                <i class="fas fa-circle-notch fa-spin mr-2"></i> HARDENING...
                                            </span>
                                        ) : 'PROTECT BINARY'}
                                    </button>
                                </div>
                            </div>

                            {/* Center Panel: Status & Analysis */}
                            <div class="lg:col-span-2 space-y-6">
                                {status === 'completed' && metadata ? (
                                    <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                        <div class="glass-card p-8 rounded-2xl shadow-sm border border-slate-200 mb-6">
                                            <div class="flex justify-between items-start mb-8">
                                                <div>
                                                    <h2 class="text-2xl font-black text-slate-800">Protection Analysis</h2>
                                                    <p class="text-slate-500 font-medium italic">Task: {taskId.substring(0,8)} | Target: {metadata.arch}</p>
                                                </div>
                                                <div class="text-right">
                                                    <div class="text-4xl font-black text-green-600 secure-pulse rounded-xl p-2 px-4 border-2 border-green-100">
                                                        {metadata.security_score}%
                                                    </div>
                                                    <p class="text-[10px] font-bold text-green-700 uppercase mt-1">Security Score</p>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-4 mb-8">
                                                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                    <p class="text-xs font-bold text-slate-400 uppercase">Complexity Increase</p>
                                                    <p class="text-xl font-black text-slate-700">{metadata.complexity_increase}</p>
                                                </div>
                                                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                                                    <p class="text-xs font-bold text-slate-400 uppercase">Protection Level</p>
                                                    <p class="text-xl font-black text-blue-600 uppercase">MIL-GRADE</p>
                                                </div>
                                            </div>

                                            <div class="mb-8">
                                                <h3 class="text-xs font-bold text-slate-500 uppercase mb-4">Applied Protections</h3>
                                                <div class="flex flex-wrap gap-2">
                                                    {metadata.protections_applied.map(p => (
                                                        <span key={p} class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl text-sm font-bold border border-blue-100">
                                                            <i class="fas fa-check-circle mr-2"></i>{p}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Logic Comparison Visualization */}
                                            <div class="mb-8 p-6 bg-slate-900 rounded-2xl border border-slate-800">
                                                <div class="flex justify-between items-center mb-4">
                                                    <h3 class="text-xs font-bold text-slate-400 uppercase">Control Flow Flattening Graph</h3>
                                                    <span class="text-[10px] text-slate-500">Node Entropy: 0.98</span>
                                                </div>
                                                <div class="h-32 flex items-center justify-center space-x-1">
                                                    {[10, 40, 20, 60, 30, 80, 45, 90, 60, 40, 70, 30].map((h, i) => (
                                                        <div key={i} style={{height: h + '%'}} class="w-full bg-blue-500/30 border-t-2 border-blue-400 rounded-t-sm"></div>
                                                    ))}
                                                </div>
                                                <p class="text-[10px] text-slate-500 mt-4 text-center">Functions successfully flattened into dispatcher switch-blocks.</p>
                                            </div>

                                            <a
                                                href={downloadUrl}
                                                class="flex items-center justify-center w-full py-4 bg-green-600 hover:bg-green-700 text-white font-black rounded-2xl shadow-lg transition-all"
                                            >
                                                <i class="fas fa-download mr-2"></i> DOWNLOAD HARDENED BINARY
                                            </a>
                                        </div>
                                    </div>
                                ) : status === 'processing' ? (
                                    <div class="flex flex-col items-center justify-center h-full min-h-[400px]">
                                        <div class="w-20 h-20 border-8 border-slate-200 border-t-blue-600 rounded-full animate-spin mb-6"></div>
                                        <h2 class="text-2xl font-black text-slate-700">Hardening in Progress</h2>
                                        <p class="text-slate-500 font-medium">Virtualizing instructions and flattening control flow...</p>
                                    </div>
                                ) : (
                                    <div class="flex flex-col items-center justify-center h-full min-h-[400px] text-slate-300">
                                        <i class="fas fa-shield-cat text-8xl mb-6 opacity-20"></i>
                                        <p class="text-xl font-bold italic">Upload a file to start protection</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer class="p-8 text-center bg-slate-100 border-t border-slate-200">
                        <div class="container mx-auto">
                            <p class="text-slate-400 text-sm font-bold">&copy; 2025 VMP SHIELD PRO | ENTERPRISE EDITION | POWERED BY LLVM</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
